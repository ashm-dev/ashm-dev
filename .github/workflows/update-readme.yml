name: Update README

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: [scripts/**, .github/workflows/update-readme.yml]

permissions:
  contents: write

concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python3 -B -m unittest discover -s scripts -v
      - name: Refresh and publish profile
        run: python3 -B scripts/update_readme.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
